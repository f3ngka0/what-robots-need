<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MV pipeline selftest — deterministic canvas + DOM</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage {
    position: relative; width: 1920px; height: 1080px; overflow: hidden;
    background: #0a0612; font-family: "Segoe UI", Arial, sans-serif;
  }
  /* --- CSS that would animate on its own: proof that animations:'disabled' works --- */
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes hue { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }
  @keyframes slide { from { left: -400px; } to { left: 1920px; } }
  #cssSpinner {
    position: absolute; top: 40px; left: 40px; width: 160px; height: 160px;
    border: 12px solid #00ffe1; border-top-color: #ff2ec4; border-radius: 50%;
    animation: spin 1.7s linear infinite; will-change: transform;
  }
  #cssBar {
    position: absolute; top: 240px; left: -400px; width: 380px; height: 26px;
    background: linear-gradient(90deg, #ff2ec4, #ffe600);
    animation: slide 3s linear infinite;
  }
  #cssHue {
    position: absolute; top: 300px; left: 40px; width: 320px; height: 120px;
    background: repeating-linear-gradient(90deg,#ff0055 0 40px,#00e5ff 40px 80px);
    animation: hue 2.5s linear infinite;
  }
  /* --- DOM-heavy HUD: 400 spans + 40 cards, all state driven only by t --- */
  #hud {
    position: absolute; left: 0; bottom: 0; width: 1920px; height: 240px;
    display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; box-sizing: border-box;
    background: rgba(0, 0, 0, 0.55);
  }
  #hud .cell {
    width: 100px; height: 44px; background: #120c22; color: #0ff;
    border: 1px solid #2a1f4a; font-size: 11px; line-height: 1.15;
    overflow: hidden; padding: 2px 3px; box-sizing: border-box;
  }
  #wordbar {
    position: absolute; top: 470px; left: 0; width: 1920px; height: 130px;
    display: flex; justify-content: center; align-items: center; gap: 2px;
    font-size: 96px; font-weight: 800; letter-spacing: 2px;
  }
  #wordbar span { display: inline-block; will-change: transform, filter; }
  #tlabel {
    position: absolute; top: 620px; left: 0; width: 1920px; text-align: center;
    color: #ffe600; font-size: 44px; font-variant-numeric: tabular-nums;
    text-shadow: 0 0 12px #ff2ec4;
  }
  canvas { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1920" height="1080"></canvas>
  <div id="cssSpinner"></div>
  <div id="cssBar"></div>
  <div id="cssHue"></div>
  <div id="wordbar"></div>
  <div id="tlabel">t = 0.000</div>
  <div id="hud"></div>
</div>
<script>
(function () {
  'use strict';
  const W = 1920, H = 1080;
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d', { alpha: false });
  const wordbar = document.getElementById('wordbar');
  const tlabel = document.getElementById('tlabel');
  const hud = document.getElementById('hud');

  const WORD = 'WHAT ROBOTS NEED';
  const letters = [];
  for (const ch of WORD) {
    const s = document.createElement('span');
    s.textContent = ch === ' ' ? '\u00a0' : ch;
    s.style.color = '#00ffe1';
    wordbar.appendChild(s);
    letters.push(s);
  }

  const cellCount = 200;
  const cells = [];
  for (let i = 0; i < cellCount; i++) {
    const d = document.createElement('div');
    d.className = 'cell';
    d.textContent = 'CELL ' + String(i).padStart(3, '0');
    hud.appendChild(d);
    cells.push(d);
  }

  // deterministic PRNG (mulberry32), no Math.random, no Date
  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const STAR_N = 260;
  const stars = [];
  for (let i = 0; i < STAR_N; i++) {
    const r = rng(1000 + i);
    stars.push({ x: r() * W, y: r() * H, z: 0.2 + r() * 0.8, p: r() * 6.283 });
  }

  // ---- the only time source in render mode: this variable ----
  let t = 0;

  function drawCanvas(tt) {
    // background: vertical gradient whose phase follows t
    const g = ctx.createLinearGradient(0, 0, 0, H);
    const ph = (tt % 12) / 12;
    g.addColorStop(0, `hsl(${Math.round(260 + 40 * Math.sin(ph * 6.283))}, 70%, 8%)`);
    g.addColorStop(0.55, `hsl(${Math.round(300 + 40 * Math.cos(ph * 6.283))}, 65%, 12%)`);
    g.addColorStop(1, `hsl(${Math.round(200 + 30 * Math.sin(ph * 12.566))}, 80%, 6%)`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // sun / rings
    const sunY = 300 + Math.sin(tt * 0.7) * 40;
    ctx.save();
    const sg = ctx.createRadialGradient(960, sunY, 20, 960, sunY, 320);
    sg.addColorStop(0, 'rgba(255,0,180,0.95)');
    sg.addColorStop(0.5, 'rgba(255,120,0,0.35)');
    sg.addColorStop(1, 'rgba(255,0,120,0)');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(960, sunY, 320, 0, Math.PI * 2); ctx.fill();

    // scanline-cut "sun" bars (deterministic on t via integer steps)
    ctx.globalCompositeOperation = 'destination-out';
    const bands = 14, bandH = 12, gap = 4, step = Math.floor(tt * 24) % 3;
    for (let i = 0; i < bands; i++) {
      const y = sunY - 60 + i * (bandH + gap) + step;
      ctx.fillRect(700, y, 520, bandH * (0.3 + 0.7 * (i / bands)));
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();

    // stars
    for (let i = 0; i < STAR_N; i++) {
      const s = stars[i];
      const yy = (s.y + tt * 40 * s.z) % H;
      const tw = 0.35 + 0.65 * Math.abs(Math.sin(tt * 3 + s.p));
      ctx.fillStyle = `rgba(180,255,255,${(0.25 + 0.6 * s.z) * tw})`;
      const sz = 1 + s.z * 2.2;
      ctx.fillRect(s.x, yy, sz, sz);
    }

    // perspective grid
    const horizon = 720;
    ctx.strokeStyle = 'rgba(0,255,225,0.42)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    for (let i = -14; i <= 14; i++) {
      ctx.moveTo(960 + i * 26, horizon);
      ctx.lineTo(960 + i * 340, H);
    }
    ctx.stroke();
    const scroll = (tt * 1.6) % 1;
    for (let i = 0; i < 18; i++) {
      const p = (i + scroll) / 18;
      const y = horizon + Math.pow(p, 2.4) * (H - horizon);
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    // bouncing deterministic orbs
    for (let i = 0; i < 12; i++) {
      const r = rng(77 + i)();
      const bx = 120 + i * 150;
      const by = 500 + Math.sin(tt * (1.1 + r) + i) * 160;
      ctx.beginPath();
      ctx.arc(bx, by, 22 + 10 * r, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${(i * 29 + tt * 60) % 360},100%,60%,0.85)`;
      ctx.fill();
    }

    // glitch blocks: derived from integer frame bucket, so stable within a frame
    const bucket = Math.floor(tt * 60);
    const rg = rng(4242 + bucket);
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 8; i++) {
      const gx = Math.floor(rg() * W);
      const gy = Math.floor(rg() * H);
      const gw = 60 + Math.floor(rg() * 360);
      const gh = 6 + Math.floor(rg() * 26);
      ctx.fillStyle = `rgba(${Math.floor(rg() * 255)},${Math.floor(rg() * 255)},255,0.16)`;
      ctx.fillRect(gx, gy, gw, gh);
    }
    ctx.globalCompositeOperation = 'source-over';

    // big timecode in canvas too (so pixel diffs are guaranteed per frame)
    ctx.font = '700 120px Consolas, monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.fillText(tt.toFixed(3), 60, 180);
  }

  function updateDom(tt) {
    const bucket = Math.floor(tt * 60);
    const rg = rng(9001 + bucket);
    for (let i = 0; i < letters.length; i++) {
      const s = letters[i];
      const y = Math.sin(tt * 5.5 + i * 0.55) * 16;
      const rot = Math.sin(tt * 3.1 + i * 0.4) * 6;
      s.style.transform = `translateY(${y.toFixed(3)}px) rotate(${rot.toFixed(3)}deg)`;
      s.style.color = `hsl(${Math.round((i * 24 + tt * 70) % 360)},100%,65%)`;
    }
    for (let i = 0; i < cells.length; i++) {
      const c = cells[i];
      const v = (Math.sin(tt * (0.9 + (i % 7) * 0.13) + i) * 0.5 + 0.5);
      c.style.background = `rgb(${Math.round(18 + v * 90)},${Math.round(12 + v * 40)},${Math.round(34 + v * 120)})`;
      c.textContent = 'C' + String(i).padStart(3, '0') + ' ' + v.toFixed(3);
    }
    tlabel.textContent = 't = ' + tt.toFixed(3) + '  f=' + bucket;
  }

  function paint(tt) {
    t = tt;
    drawCanvas(tt);
    updateDom(tt);
  }

  window.MV = {
    version: 'selftest-1',
    duration: 20,
    fps: 60,
    width: W,
    height: H,
    seek: function (seconds) {
      const tt = Number(seconds) || 0;
      paint(tt);
      return tt;
    },
    get time() { return t; },
  };

  window.addEventListener('error', function (e) {
    window.__MV_ERROR = String(e.message || e);
  });

  paint(0);
  // Simulate async asset load so record.mjs exercises the ready-wait path.
  setTimeout(function () { window.__MV_READY = true; }, 150);
})();
</script>
</body>
</html>
